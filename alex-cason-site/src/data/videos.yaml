# YouTube channel + videos.
#
# Set channel_url once you have it — the "Subscribe" link on the YouTube
# page only appears when this is non-empty.
#
# For each video: set `url` to the real YouTube link when published. Leave
# `thumbnail` as "" to use a generated placeholder graphic, or point it at
# an image path (e.g. "assets/img/thumb-01.jpg") once you export a real
# thumbnail.

channel_url: "https://www.youtube.com/@Eudaimonia_society"

videos:
  - title: "Metriplectic series 1: Why Ordinary Hamiltonians are non-dissipative"
    description: >
      First in a series on metriplectic dynamics, starting from why ordinary
      Hamiltonian systems(Symplectic) cannot describe dissipation in order to motivate the metriplectic system..
    url: "https://www.youtube.com/watch?v=WF8mm-Z2oQM"
    thumbnail: "https://i.ytimg.com/vi/WF8mm-Z2oQM/hqdefault.jpg"
    date: "~2026-10-12"

  - title: "What is Velocity really? (joke video)"
    description: >
      A joke video asking what velocity really is. Using obtuse mathematical abstraction.
    url: "https://www.youtube.com/watch?v=K4NQshgqGrM"
    thumbnail: "https://i.ytimg.com/vi/K4NQshgqGrM/hqdefault.jpg"
    date: "~2026-10-03"

  - title: "Introduction to Discontinuous Galerkin through Toy Core Collapse Supernova"
    description: >
      An introduction to discontinuous Galerkin methods, using a toy
      model of a self-gravitating fluid. Expanding even more by conserving energy as well as positivity.
    url: "https://www.youtube.com/watch?v=8vs1dTuPKFw"
    thumbnail: "https://i.ytimg.com/vi/8vs1dTuPKFw/hqdefault.jpg"
    date: "~2026-09"

  - title: "Lie Operator Splitting: One of the Ten Pillars"
    description: >
      A look at Lie operator splitting, framed as one of "ten pillars."
    url: "https://www.youtube.com/watch?v=qgA-iY-iA4k"
    thumbnail: "https://i.ytimg.com/vi/qgA-iY-iA4k/hqdefault.jpg"
    date: "~2026-09"

  - title: "Building Hyper Efficient Solar System Model: WHCKL"
    description: >
      Building a highly efficient solar system model using WHCKL. Able to simulate a reduced solar system for two billion years.
    url: "https://www.youtube.com/watch?v=bRJSR83mbBw"
    thumbnail: "https://i.ytimg.com/vi/bRJSR83mbBw/hqdefault.jpg"
    date: "~2026-08"

  - title: "What if you exert a Planck Force onto the Earth?"
    description: >
      Simulating a Planck force onto a TOV simulation of the Earth, or a close enough approximation, using Einstien toolkit. Then, trying to abstract out to see if one could destroy a universe.
    url: "https://www.youtube.com/watch?v=T1Wavd506Do"
    thumbnail: "https://i.ytimg.com/vi/T1Wavd506Do/hqdefault.jpg"
    date: "~2026-08"

  - title: "Variational Integrators for Reduced Magnetohydrodynamics"
    description: >
      Deriving Variational integrators applied to reduced magnetohydrodynamics.
    url: "https://www.youtube.com/watch?v=9vPSSewfwI4"
    thumbnail: "https://i.ytimg.com/vi/9vPSSewfwI4/hqdefault.jpg"
    date: "~2026-08"

  - title: "Introduction to Symplectic integrators"
    description: >
      An introduction to symplectic integrators.
    url: "https://www.youtube.com/watch?v=yYiiJV7aWlY"
    thumbnail: "https://i.ytimg.com/vi/yYiiJV7aWlY/hqdefault.jpg"
    date: "~2026-08"
