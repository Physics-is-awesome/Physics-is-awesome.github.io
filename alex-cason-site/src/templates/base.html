<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Alex Cason{% endblock %}</title>
<meta name="description" content="{% block description %}Alex Cason — undergraduate physics student at the University of Tennessee, Knoxville.{% endblock %}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f4f5f1'/%3E%3Cellipse cx='16' cy='16' rx='11' ry='6' fill='none' stroke='%233b4c8c' stroke-width='1.6'/%3E%3Ccircle cx='27' cy='16' r='2.1' fill='%233b4c8c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ root }}assets/css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
{% block extra_head %}{% endblock %}
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="{{ root }}index.html" class="site-id">Alex Cason<span class="dot">.</span></a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ root }}index.html"{% if active == "home" %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ root }}research.html"{% if active == "research" %} aria-current="page"{% endif %}>Research</a>
      <a href="{{ root }}projects.html"{% if active == "projects" %} aria-current="page"{% endif %}>Projects</a>
      <a href="{{ root }}notes.html"{% if active == "notes" %} aria-current="page"{% endif %}>Notes</a>
      <a href="{{ root }}youtube.html"{% if active == "youtube" %} aria-current="page"{% endif %}>YouTube</a>
      <a href="{{ root }}about.html"{% if active == "about" %} aria-current="page"{% endif %}>About</a>
      <a href="{{ root }}cv.html"{% if active == "cv" %} aria-current="page"{% endif %}>CV</a>
    </nav>
  </div>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>© <span id="year"></span> Alex Cason. Built as a static site.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="{{ root }}assets/js/data/social-links.js"></script>
<script src="{{ root }}assets/js/data/projects.js"></script>
<script src="{{ root }}assets/js/data/videos.js"></script>
<script src="{{ root }}assets/js/data/notes-index.js"></script>
<script src="{{ root }}assets/js/main.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
